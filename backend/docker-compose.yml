# 서버에서: cp .env.example .env 로 값 채운 뒤 docker compose up -d --build
# 프로젝트 이름을 고정한다. 폴더 이름(backend)을 그대로 쓰면 같은 서버의 다른 backend 프로젝트와 섞인다
name: whose-fault

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: whosefault
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 로컬 개발 때 ./gradlew bootRun 이 붙을 수 있게 로컬에만 연다
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d whosefault"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    # 고해야지와 같은 서버를 쓰므로 메모리 상한을 둔다. JVM은 이 값의 75%를 힙으로 쓴다
    mem_limit: ${API_MEM_LIMIT:-768m}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/whosefault
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TOKEN_SECRET: ${TOKEN_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS}
    # 리버스 프록시(nginx, Cloudflare Tunnel 등)만 붙도록 로컬에만 연다
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8080"

volumes:
  pgdata:
