# 서버에서: cp .env.example .env 로 값 채운 뒤 docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: whosefault
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 로컬 개발 때 ./gradlew bootRun 이 붙을 수 있게 로컬에만 연다
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d whosefault"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/whosefault
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TOKEN_SECRET: ${TOKEN_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS}
    # 리버스 프록시(nginx, Cloudflare Tunnel 등)만 붙도록 로컬에만 연다
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8080"

volumes:
  pgdata:
